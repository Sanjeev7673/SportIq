name: SportIQ quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, review-ready-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportiq-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build

  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend modules
        run: python -m compileall -q backend

  backend-health:
    name: Live backend health smoke test
    # Runs only when a repository variable BACKEND_URL (e.g. https://host, no trailing slash) is set.
    if: ${{ vars.BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wake and verify the deployed API
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 35 \
            "${{ vars.BACKEND_URL }}/health"
